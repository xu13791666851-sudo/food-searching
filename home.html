<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>在家吃 · 今天吃什么</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="mobile-app-page">
    <main class="app-shell tab-page-shell">
      <header class="tab-page-hero">
        <p class="eyebrow">在家吃</p>
        <h1>按今天状态想菜</h1>
        <p>适合家里有食材、不想出门、想少洗碗或想吃健康一点的时候。</p>
      </header>

      <section class="tab-card">
        <h2>直接让 Agent 想</h2>
        <p>比如：家里有鸡蛋番茄，想高蛋白，30 分钟内。</p>
        <a class="primary-link-button" href="index.html">回首页说一句</a>
      </section>

      <section class="tab-card">
        <h2>在家吃常用目标</h2>
        <div class="tab-chip-list">
          <span>少洗碗</span>
          <span>15 分钟内</span>
          <span>不想买菜</span>
          <span>高蛋白</span>
          <span>热乎一点</span>
          <span>清爽少油</span>
        </div>
      </section>

      <section class="tab-card">
        <h2>可以这样问</h2>
        <div class="tab-prompt-list">
          <p>在家吃，冰箱有鸡蛋和青菜。</p>
          <p>不想洗碗，想吃热乎一点。</p>
          <p>想吃高蛋白，别太油。</p>
        </div>
      </section>
    </main>

    <nav class="bottom-tab-bar" aria-label="主导航">
      <a href="index.html"><span>⌂</span><strong>首页</strong></a>
      <a href="out.html"><span>⌕</span><strong>外面吃</strong></a>
      <a class="active" href="home.html"><span>□</span><strong>在家吃</strong></a>
      <a href="me.html"><span>♡</span><strong>我的</strong></a>
    </nav>
  </body>
</html>
